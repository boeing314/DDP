# Central configuration for the SUMO network and Pure-DIPF controller.
# The SUMO XML files are generated from this file by generate_sumo.py.
# dipf_controller.py also reads this file, so simulation/controller geometry
# should not be duplicated between Python and XML.

simulation:
  net_name: straight3lane
  road_length_m: 1000.0
  lanes: 3
  lane_width_m: 3.5
  edge_speed_mps: 20.0
  begin: 0.0
  end: 3600.0
  step_length: 0.1
  seed: 42

ego:
  id: ego
  type_id: egoType
  depart_time: 20.0
  start_x: 2.5
  start_lane: 2
  start_speed_mps: 12.0
  goal_x_offset_from_end_m: 15.0
  goal_lane_index: 0
  goal_tolerance_x: 1.5
  goal_tolerance_y: 1.2
  success_any_lane: true
  length_m: 4.583
  width_m: 1.748
  max_speed_mps: 34.0
  max_accel_mps2: 3.2
  max_lateral_accel_mps2: 3.0
  max_lateral_speed_mps: 3.0
  max_jerk_mps3: 10.0
  max_lateral_jerk_mps3: 10.0

dipf:
  lambda_obs: 1
  alpha: 1.6422052478480245
  tau_x_base: 1.0
  tau_y_base: 1.8648315932156687

  sx: 1.0
  sy: 0.0
  delta_lane: 400.0

  w_dest: 1.0
  w_obs: 1.0
  w_lane: 1.0

  dv_max_front: 10.0

  obs_radius_ahead: 50.0
  obs_radius_behind: 20.0
  lateral_band: 8.0

  grad_eps: 0.05
  y_margin: 0.1

stuck_detection:
  speed_threshold_mps: 0.35
  window_sec: 8.0
  progress_threshold_m: 2.0

movement:
  move_match_threshold: 1000.0
  move_keep_route: 2
  x_min_safe: 0.5
  x_max_margin_m: 0.5
  lateral_resolution_m: 0.25
  debug_interval_sec: 2.0

