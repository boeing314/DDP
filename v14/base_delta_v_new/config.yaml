# Central configuration for the SUMO network and Pure-DIPF controller.
# The SUMO XML files are generated from this file by generate_sumo.py.
# dipf_controller.py also reads this file, so simulation/controller geometry
# should not be duplicated between Python and XML.

simulation:
  net_name: straight3lane
  road_length_m: 500.0
  lanes: 3
  lane_width_m: 3.5
  edge_speed_mps: 20.0
  begin: 0.0
  end: 3600.0
  step_length: 0.1
  seed: 45

ego:
  id: ego
  type_id: egoType
  depart_time: 10.0              # spawn_mode route only
  spawn_mode: convert            # route: own <vehicle> at depart_time | convert: take over a traffic vehicle
  convert_time_s: 30.0           # convert: traffic runs this long first
  convert_type: car              # convert: only vehicles of this type are candidates (null = any)
  convert_pick: nearest          # nearest: the candidate whose centre is nearest convert_x_m | latest: the last one inserted
  convert_x_m: 100.0             # convert_pick nearest: target position along the road (m)
  start_x: 2.5                   # body centre (departPos = start_x + length/2)
  start_lane: random             # lane index 0/1/2, or random (SUMO picks per seed; reproducible for a given seed)
  start_speed_mps: 13.54         # = measured avg entry speed of other vehicles (depart_speed: max, seeds 42/1/2, 900 s)
  goal_x_offset_from_end_m: 15.0
  goal_lane_index: 0
  goal_tolerance_x: 1.5
  goal_tolerance_y: 1.2
  success_any_lane: true
  length_m: 4.583
  width_m: 1.748
  max_speed_mps: 34.0            # ego max velocity (controller clamp + SUMO egoType maxSpeed)
  max_accel_mps2: 3.2            # forward acceleration limit
  max_decel_mps2: 9.0            # braking limit = SUMO's emergency deceleration (default emergencyDecel 9 m/s^2)
  max_lateral_accel_mps2: 3.0
  max_lateral_speed_mps: 3.0
  limit_acceleration: true       # false: no clamp on ax/ay (max_accel/decel/lateral_accel ignored)
  limit_heading: true            # true: |vy| <= vx*tan(max_heading_deg) -- sideways speed in proportion to forward speed
  max_heading_deg: 15.0          # max angle between the ego's velocity (= heading) and the road

dipf:
  # v9 baseline. Starting values: the v6 DE optimum (tau_x_base now fixed).
  # optimize_de.py (v9) / optimize_optuna.py (v10) tune the keys in optimization.bounds.
  lambda_obs: 0.011272475529718199     # was 0.41235729303613755 (before optimisation)
  alpha: 0.3961303778534381             # was 1.0918822760135338 (before optimisation)
  tau_x_base: 1.0                # FIXED (not tuned)
  tau_y_base: 0.05278345640064817       # was 0.10841282892592682 (before optimisation)

  sx: 2.4407233859461716e-06            # was 0.00010090196246466377 (before optimisation)
  sy: 0.0
  delta_lane: 0.002076187143684305      # was 0.01 (before optimisation)

  w_dest: 1.0
  w_obs: 1.0
  w_lane: 1.0

  use_dv_numerator: false        # (|dv| numerator of v14/base_delta_v: off here)
  approach_numerator: true       # v14/base_delta_v_new: U_obs = lambda*(1 + max(dv_approach/v_max, 0))/k'
  dv_max: 34.0                   # v_max = the maximum speed (ego.max_speed_mps), a constant
  swap_wl_in_kprime: true        # true: (1-l/|Dx|) / (1-w/|Dy|), wall at body contact; false: report form

  obs_radius_ahead: 70.45312244060881   # was 159.6767057724885 (before optimisation)
  obs_radius_behind: 20.0
  lateral_band: 8.0

  grad_eps: 0.05
  y_margin: 0.04332107137581335         # was 0.01 (before optimisation)

cost:
  ttc_threshold_s: 3.0           # TTC at/above this counts as no collision risk
  w_collision: 25.0
  w_dist: 5.0
  w_time: 1.0

encoding:
  range_m: 150.0                 # --log-encoding: vehicles within this longitudinal distance are encoded

pipeline:
  # ---- scenarios (step 1): traffic runs ego.convert_time_s, the car nearest ego.convert_x_m becomes
  #      the ego, the full state is saved at that moment. Same scenarios as v11/v12 for the same seeds.
  scenarios_dir: ../base/scenarios   # the SAME scenarios as v14/base
  end_x_m: 400.0                 # a segment succeeds when the ego reaches this x without a collision
  max_time_s: 60.0               # simulated-time limit per segment run
  seeds:                         # inclusive ranges; step 1 creates scenarios for all of them
    train: [0, 99]               # every CMA-ES candidate is scored on these (part of the v12 library pool seeds)
    val: [400, 499]              # picks the final policy (same as v12 library validation)
    test: [5000, 5299]           # fresh scenarios for the final comparison (same as v12 step 5)
  futures: {train: 2, val: 3, test: 3}   # each scenario is replayed with SUMO seeds 1..n
  n_jobs: null                   # parallel simulations; null = cpu_count - 1

  # ---- fixed-parameter search (step 2): the best CONSTANT set, all tuned keys, CMA-ES in log space
  base_search:
    start_params:                # search start = v12 library set 2 (the v13 base)
      lambda_obs: 322.05972635899286
      alpha: 0.23075655639858395
      tau_y_base: 0.5275588811396323
      sx: 0.0063539591668354
      delta_lane: 80.03257169030859
      obs_radius_ahead: 75.23552920395588
      y_margin: 0.012822331378361022
    bounds:                      # log-uniform ranges (v12 library ranges; obstacle radius floor 10 m as in v14/adaptive)
      lambda_obs:       [0.01, 10000.0]
      alpha:            [0.01, 100.0]
      tau_y_base:       [0.01, 20.0]
      sx:               [1.0e-6, 10.0]
      delta_lane:       [0.0001, 1000.0]
      obs_radius_ahead: [10.0, 250.0]
      y_margin:         [0.001, 1.0]

  # ---- training (step 2): CMA-ES on closed-loop segment success -- SAME budget as v14/adaptive
  cmaes:
    sigma0: 0.15                 # in units of each parameter's log10 range (0.15 = 15% of the range)
    popsize: 15                  # same as v14/adaptive (fixed so the budgets match: 15 x 32 = 480 candidates)
    generations: 32
    w_progress: 0.1              # J = success + w_progress * progress
    val_every: 4
    rng_seed: 0

stuck_detection:
  speed_threshold_mps: 0.35
  window_sec: 8.0
  progress_threshold_m: 2.0

movement:
  move_match_threshold: 1000.0
  move_keep_route: 2
  lateral_resolution_m: 0.25
  debug_interval_sec: 2.0

